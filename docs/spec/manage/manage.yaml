openapi: 3.0.3
info:
  title: Search Manager Options REST API
  version: '8.0'
  description: |-
    The Search Manager Options REST API is provided by the Search service.
    This API enables you to set Search manager options; in particular, to configure rebalance based on file transfer.

servers:
  - url: '{scheme}://{host}:{port}'
    description: The URL scheme, host, and port are as follows.
    variables:
      scheme:
        default: http
        description: |-
          The URL scheme.
          Use `https` for secure access.
        enum:
          - http
          - https
      host:
        default: localhost
        description: The host name or IP address of a node running the Search Service.
      port:
        default: "8094"
        description: |-
          The Search Service REST port.
          Use `18094` for secure access.
        enum:
          - "8094"
          - "18094"

paths:
  /api/managerOptions:
    put:
      operationId: put_options
      summary: Modify Search Manager Options
      description: |-
        Sets Search manager options.
        The options you specify are merged with the existing options, so you only need to include the options you want to change.
        Specify all option values as strings.
      requestBody:
        description: An object specifying Search manager options.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Options"
      security:
        - Default: []
      responses:
        "200":
          $ref: '#/components/responses/OK'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "405":
          $ref: '#/components/responses/NotAllowed'
      x-codeSamples:
        - lang: Shell
          label: Disable
          source:
            $ref: 'examples/file-xfer-disable.sh'
        - lang: Shell
          label: Enable
          source:
            $ref: 'examples/file-xfer-enable.sh'

components:
  schemas:
    Options:
      type: object
      properties:
        disableFileTransferRebalance:
          type: boolean
          description: |-
            If the value is `false` (the default), new Search Service partitions are created during rebalance by means of partition file transfer.

            If the value is `true`, partitions are created by means of partition build, from scratch, over DCP connections from the Data Service.
          default: false
          x-has-default: true
        customScriptQueriesEnabled:
          type: string
          enum:
            - "true"
            - "false"
          description: |-
            Whether Search queries can use the `custom_filter` and `custom_score` query types, which run user-supplied JavaScript functions.
            This option applies to the whole cluster and is available only in Couchbase Server Enterprise Edition.

            If the value is `false` (the default), any Search query that uses these query types fails.
          default: "false"
          x-has-default: true
        searchHistoryEnabled:
          type: string
          enum:
            - "true"
            - "false"
          description: |-
            Whether the Search Service records Search requests in the search history.
            Use the View Search History API to retrieve recorded requests.
          default: "false"
          x-has-default: true
        searchHistoryMaxRecords:
          type: string
          description: |-
            The maximum number of Search requests recorded in the search history on each node.
            The value must be between `1` and `20000`.
          default: "8000"
          x-has-default: true
        collectionsLimitPerIndex:
          type: string
          description: |-
            The maximum number of source collections for a single Search index.
            A collection with more than one type mapping counts once for each type mapping.

            The Search Service rejects any request to create or update a Search index that exceeds this limit.
          default: "100"
          x-has-default: true
        scanPlusNumWorkers:
          type: string
          description: |-
            The number of workers each node uses to fetch sequence numbers from the Data Service for Search queries with `scan_plus` consistency.
            The value must be `1` or greater.
          default: "10"
          x-has-default: true
        scanPlusNumRetries:
          type: string
          description: |-
            The number of times the Search Service retries a failed request to fetch sequence numbers from the Data Service for Search queries with `scan_plus` consistency.
            The value must be `1` or greater.
          default: "5"
          x-has-default: true
        numSamplesPerCentroid:
          type: string
          description: |-
            The number of training samples per centroid for vector indexes that have `vector_index_fast_merge` enabled.
            Values less than `39` are treated as `39`, and values greater than `256` are treated as `256`.
          default: "39"
          x-has-default: true
        enableLazyIndexUpdate:
          type: string
          description: |-
            Whether the Search Service can update an existing Search index in place, without rebuilding it, when an index definition update deletes or modifies fields.
            Set the value to `True` to enable in-place updates.
            Any other value disables them.
        bleveMaxTerms:
          type: string
          description: |-
            The maximum number of term searchers a Search query can use on each index partition.
            A query that exceeds this limit fails.
            You can override this limit for a single query with the `bleveMaxTerms` property in the `ctl` object.

            A value of `0` or less disables the limit.
          default: "1024"
          x-has-default: true

    Response:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: >
            The status of the operation.
        error:
          type: string
          description: >
            The error message, if the operation was not successful.

  responses:
    OK:
      description: The operation was successful.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
          example:
            $ref: "examples/file-xfer-200.json"

    NotFound:
      description: >
        Object not found.
        The URL may be incorrectly specified.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"

    NotAllowed:
      description: >
        Method not allowed.
        The method may be incorrectly specified.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"
          example:
            $ref: "examples/file-xfer-405.json"

    Unauthorized:
      description: >
        Failure to authenticate.
        The user name or password may be incorrect.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Response"

  securitySchemes:
    Default:
      type: http
      scheme: basic
